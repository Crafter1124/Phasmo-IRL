<style>
    body {
        background: #0a0a0d;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        margin: 0;
    }

    #controls {
        width: 220px;
        padding: 20px;
        background: #11131b;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 12px;
        font-size: 18px;
        background: #222636;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.15s;
    }

    button:hover {
        background: #2f3650;
        transform: translateY(-1px);
    }

    /* Zone EMF bien centrée */
    #emf-zone {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Boîtier parfaitement droit */
    .emf-body {
        width: 240px;
        height: 480px;
        background: #1b1f2b;
        border-radius: 30px;
        position: relative;
        box-shadow: 0 0 25px rgba(0,0,0,0.8);
        border: 3px solid #30364a;
    }

    /* Tête EMF droite, sans rotation */
    .emf-head {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%); /* plus de rotate */
        width: 190px;
        height: 80px;
        background: #0f121b;
        border-radius: 20px;
        border: 3px solid #2b3144;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
    }

    .emf-led {
        width: 26px;
        height: 50px;
        border-radius: 10px;
        background: #333;
        opacity: 0.15;
        box-shadow: 0 0 0 transparent;
        transition: 0.2s;
    }

    .emf-led.active {
        opacity: 1;
        box-shadow: 0 0 10px currentColor;
    }

    #led1 { background: #00c853; color: #00c853; }
    #led2 { background: #00b0ff; color: #00b0ff; }
    #led3 { background: #ffeb3b; color: #ffeb3b; }
    #led4 { background: #ff9800; color: #ff9800; }
    #led5 { background: #ff1744; color: #ff1744; }

    .emf-screen {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 80px;
        background: #10131d;
        border-radius: 12px;
        border: 2px solid #262c3f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .emf-label {
        font-size: 14px;
        color: #9fa6c7;
        margin-bottom: 5px;
    }

    .emf-value {
        font-size: 32px;
        letter-spacing: 2px;
        color: #36f9a5;
    }

    .emf-button {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #3b425c, #151822);
        border: 3px solid #3c4258;
        box-shadow: 0 0 12px rgba(0,0,0,0.8);
    }

    .emf-bottom-text {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #70789a;
    }
</style>
