<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Phasmo IRL • EMF & Thermomètre</title>

<style>
    body {
        background: #0a0a0d;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    /* Boutons de mode */
    #mode-switch {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
    }

    #mode-switch button {
        padding: 10px 15px;
        background: #222636;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    #mode-switch button:hover {
        background: #2f3650;
    }

    /* EMF MODE */
    #emf-mode {
        display: flex;
        height: 100%;
    }

    #controls {
        width: 220px;
        padding: 20px;
        background: #11131b;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 0 15px #000;
    }

    #controls button {
        padding: 12px;
        font-size: 18px;
        background: #222636;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.15s;
    }

    #controls button:hover {
        background: #2f3650;
        transform: translateY(-1px);
    }

    #emf-zone {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .emf-body {
        width: 240px;
        height: 480px;
        background: #1b1f2b;
        border-radius: 30px;
        position: relative;
        box-shadow: 0 0 25px rgba(0,0,0,0.8);
        border: 3px solid #30364a;
    }

    .emf-head {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 75px;
        background: #0f121b;
        border-radius: 15px;
        border: 3px solid #2b3144;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
    }

    .emf-led {
        width: 24px;
        height: 50px;
        border-radius: 8px;
        background: #333;
        opacity: 0.15;
        transition: 0.2s;
    }

    .emf-led.active {
        opacity: 1;
        box-shadow: 0 0 10px currentColor;
    }

    #led1 { background: #00FF00; }
    #led2 { background: #66FF00; }
    #led3 { background: #FFFF00; }
    #led4 { background: #FF9900; }
    #led5 { background: #FF0000; }

    .emf-screen {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 80px;
        background: #10131d;
        border-radius: 12px;
        border: 2px solid #262c3f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .emf-label {
        font-size: 14px;
        color: #9fa6c7;
        margin-bottom: 5px;
    }

    .emf-value {
        font-size: 32px;
        letter-spacing: 2px;
        color: #36f9a5;
    }

    .emf-bottom-text {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #70789a;
    }

    /* THERMOMÈTRE MODE */
    #thermo-mode {
        display: none;
        height: 100%;
        padding: 20px;
    }

    #thermo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        flex-direction: column;
        gap: 20px;
    }

    #thermo-display {
        font-size: 60px;
        color: #36f9a5;
        margin-bottom: 20px;
    }

    #room-buttons button {
        padding: 10px 15px;
        background: #222636;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        margin: 5px;
    }

    #room-buttons button:hover {
        background: #2f3650;
    }

    #last-room {
        font-size: 20px;
        color: #9fa6c7;
    }

    #temp-input {
        padding: 10px;
        font-size: 20px;
        width: 120px;
        text-align: center;
        border-radius: 8px;
        border: none;
        background: #222636;
        color: white;
    }

</style>
</head>

<body>

<!-- SWITCH DE MODE -->
<div id="mode-switch">
    <button onclick="showEMF()">EMF</button>
    <button onclick="showThermo()">Thermomètre</button>
</div>

<!-- MODE EMF -->
<div id="emf-mode">
    <div id="controls">
        <button onclick="setEMF(1)">EMF 1</button>
        <button onclick="setEMF(2)">EMF 2</button>
        <button onclick="setEMF(3)">EMF 3</button>
        <button onclick="setEMF(4)">EMF 4</button>
        <button onclick="setEMF(5)">EMF 5</button>
    </div>

    <div id="emf-zone">
        <div class="emf-body">

            <div class="emf-head">
                <div id="led1" class="emf-led"></div>
                <div id="led2" class="emf-led"></div>
                <div id="led3" class="emf-led"></div>
                <div id="led4" class="emf-led"></div>
                <div id="led5" class="emf-led"></div>
            </div>

            <div class="emf-screen">
                <div class="emf-label">Niveau EMF</div>
                <div id="emf-value" class="emf-value">0</div>
            </div>

            <div class="emf-button"></div>

            <div class="emf-bottom-text">
                EMF Reader • Phasmo IRL
            </div>

        </div>
    </div>
</div>

<!-- MODE THERMOMÈTRE -->
<div id="thermo-mode">
    <div id="thermo-container">

        <div id="last-room">Dernière requête : aucune</div>

        <div id="thermo-display">-- °C</div>

        <input id="temp-input" type="number" placeholder="Température" />

        <button onclick="sendTemperature()">Envoyer</button>

        <div id="room-buttons">
            <button onclick="setRoom('Salon')">Salon</button>
            <button onclick="setRoom('Cuisine')">Cuisine</button>
            <button onclick="setRoom('Salle à manger')">Salle à manger</button>
            <button onclick="setRoom('Garage')">Garage</button>
        </div>

    </div>
</div>

<!-- Sons -->
<audio id="sound1" src="sound1.mp3"></audio>
<audio id="sound2" src="SonEMF/emf2.mp3"></audio>
<audio id="sound3" src="SonEMF/emf3.mp3"></audio>
<audio id="sound4" src="SonEMF/emf4.mp3"></audio>
<audio id="sound5" src="SonEMF/emf5.mp3"></audio>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDOTNHQhMFBq0U07yD853fddh-KtiClObk",
  authDomain: "phasmo-irl-654f9.firebaseapp.com",
  databaseURL: "https://phasmo-irl-654f9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "phasmo-irl-654f9",
  storageBucket: "phasmo-irl-654f9.firebasestorage.app",
  messagingSenderId: "902059581012",
  appId: "1:902059581012:web:855445afb0a72182c397c1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* SWITCH DE MODE */
function showEMF() {
    document.getElementById("emf-mode").style.display = "flex";
    document.getElementById("thermo-mode").style.display = "none";
}

function showThermo() {
    document.getElementById("emf-mode").style.display = "none";
    document.getElementById("thermo-mode").style.display = "block";
}

/* EMF */
let currentSound = null;

function setEMF(level) {
    const unlock = new Audio();
    unlock.play().catch(() => {});
    db.ref("emfLevel").set(level);
}

db.ref("emfLevel").on("value", snapshot => {
    const level = snapshot.val();
    applyEMF(level);
});

function applyEMF(level) {
    for (let i = 1; i <= 5; i++) {
        document.getElementById("led" + i).classList.remove("active");
    }
    for (let i = 1; i <= level; i++) {
        document.getElementById("led" + i).classList.add("active");
    }

    document.getElementById("emf-value").textContent = level;

    if (currentSound) {
        currentSound.pause();
        currentSound.currentTime = 0;
    }

    currentSound = document.getElementById("sound" + level);
    currentSound.loop = true;
    currentSound.play();
}

/* THERMOMÈTRE */
function setRoom(room) {
    db.ref("lastRoom").set(room);
}

db.ref("lastRoom").on("value", snapshot => {
    const room = snapshot.val();
    document.getElementById("last-room").textContent = "Dernière requête : " + room;
});

function sendTemperature() {
    const temp = document.getElementById("temp-input").value;
    db.ref("temperature").set(temp);
}

db.ref("temperature").on("value", snapshot => {
    const temp = snapshot.val();
    document.getElementById("thermo-display").textContent = temp + " °C";
});
</script>

</body>
</html>
