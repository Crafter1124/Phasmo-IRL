<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EMF Phasmo IRL</title>
<style>
    body {
        background: #0a0a0d;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        margin: 0;
    }

    /* Zone des boutons */
    #controls {
        width: 220px;
        padding: 20px;
        background: #11131b;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 12px;
        font-size: 18px;
        background: #222636;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.15s;
    }

    button:hover {
        background: #2f3650;
        transform: translateY(-1px);
    }

    /* Zone EMF */
    #emf-zone {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Boîtier EMF réaliste */
    .emf-body {
        width: 240px;
        height: 480px;
        background: #1b1f2b;
        border-radius: 30px;
        position: relative;
        box-shadow: 0 0 25px rgba(0,0,0,0.8);
        border: 3px solid #30364a;
        transform: rotate(-2deg);
    }

    /* Tête inclinée comme le vrai EMF */
    .emf-head {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) rotate(-6deg);
        width: 180px;
        height: 110px;
        background: #0f121b;
        border-radius: 60px;
        border: 3px solid #2b3144;
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        padding-bottom: 20px;
    }

    .emf-led {
        width: 28px;
        height: 60px;
        border-radius: 14px;
        background: #333;
        opacity: 0.15;
        box-shadow: 0 0 0 transparent;
        transition: 0.2s;
    }

    .emf-led.active {
        opacity: 1;
        box-shadow: 0 0 14px currentColor;
    }

    #led1 { background: #00c853; color: #00c853; }
    #led2 { background: #00b0ff; color: #00b0ff; }
    #led3 { background: #ffeb3b; color: #ffeb3b; }
    #led4 { background: #ff9800; color: #ff9800; }
    #led5 { background: #ff1744; color: #ff1744; }

    /* Écran */
    .emf-screen {
        position: absolute;
        top: 160px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 80px;
        background: #10131d;
        border-radius: 12px;
        border: 2px solid #262c3f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .emf-label {
        font-size: 14px;
        color: #9fa6c7;
        margin-bottom: 5px;
    }

    .emf-value {
        font-size: 32px;
        letter-spacing: 2px;
        color: #36f9a5;
    }

    /* Bouton rond */
    .emf-button {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #3b425c, #151822);
        border: 3px solid #3c4258;
        box-shadow: 0 0 12px rgba(0,0,0,0.8);
    }

    .emf-bottom-text {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #70789a;
    }
</style>
</head>
<body>

<div id="controls">
    <button onclick="setEMF(1)">EMF 1</button>
    <button onclick="setEMF(2)">EMF 2</button>
    <button onclick="setEMF(3)">EMF 3</button>
    <button onclick="setEMF(4)">EMF 4</button>
    <button onclick="setEMF(5)">EMF 5</button>
</div>

<div id="emf-zone">
    <div class="emf-body">
        <div class="emf-head">
            <div id="led1" class="emf-led"></div>
            <div id="led2" class="emf-led"></div>
            <div id="led3" class="emf-led"></div>
            <div id="led4" class="emf-led"></div>
            <div id="led5" class="emf-led"></div>
        </div>

        <div class="emf-screen">
            <div class="emf-label">Niveau EMF</div>
            <div id="emf-value" class="emf-value">0</div>
        </div>

        <div class="emf-button"></div>

        <div class="emf-bottom-text">
            EMF Reader • Phasmo IRL
        </div>
    </div>
</div>

<!-- Sons -->
<audio id="sound1" src="https://assets.mixkit.co/sfx/preview/mixkit-small-click-1123.mp3"></audio>
<audio id="sound2" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-pop-2350.mp3"></audio>
<audio id="sound3" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1125.mp3"></audio>
<audio id="sound4" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="sound5" src="https://assets.mixkit.co/sfx/preview/mixkit-warning-alarm-buzzer-991.mp3"></audio>

<script>
function setEMF(level) {
    for (let i = 1; i <= 5; i++) {
        document.getElementById("led" + i).classList.remove("active");
    }
    for (let i = 1; i <= level; i++) {
        document.getElementById("led" + i).classList.add("active");
    }

    document.getElementById("emf-value").textContent = level;

    const sound = document.getElementById("sound" + level);
    sound.currentTime = 0;
    sound.play();
}
</script>

</body>
</html>
