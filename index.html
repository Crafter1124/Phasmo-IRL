<style>
    body {
        background: #0a0a0d;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        margin: 0;
    }

    #controls {
        width: 220px;
        padding: 20px;
        background: #11131b;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 12px;
        font-size: 18px;
        background: #222636;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.15s;
    }

    button:hover {
        background: #2f3650;
        transform: translateY(-1px);
    }

    /* EMF centré parfaitement */
    #emf-zone {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Boîtier droit */
    .emf-body {
        width: 240px;
        height: 480px;
        background: #1b1f2b;
        border-radius: 30px;
        position: relative;
        box-shadow: 0 0 25px rgba(0,0,0,0.8);
        border: 3px solid #30364a;
        transform: none; /* IMPORTANT */
    }

    /* Tête EMF parfaitement droite */
    .emf-head {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%); /* PAS DE ROTATION */
        width: 160px; /* FIX : plus étroit */
        height: 70px; /* FIX : plus compact */
        background: #0f121b;
        border-radius: 15px;
        border: 3px solid #2b3144;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
    }

    /* LEDs droites */
    .emf-led {
        width: 22px;
        height: 45px;
        border-radius: 8px;
        background: #333;
        opacity: 0.15;
        transition: 0.2s;
    }

    .emf-led.active {
        opacity: 1;
        box-shadow: 0 0 10px currentColor;
    }

    #led1 { background: #00c853; color: #00c853; }
    #led2 { background: #00b0ff; color: #00b0ff; }
    #led3 { background: #ffeb3b; color: #ffeb3b; }
    #led4 { background: #ff9800; color: #ff9800; }
    #led5 { background: #ff1744; color: #ff1744; }

    /* Écran droit */
    .emf-screen {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 80px;
        background: #10131d;
        border-radius: 12px;
        border: 2px solid #262c3f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .emf-label {
        font-size: 14px;
        color: #9fa6c7;
        margin-bottom: 5px;
    }

    .emf-value {
        font-size: 32px;
        letter-spacing: 2px;
        color: #36f9a5;
    }

    /* Bouton rond centré */
    .emf-button {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #3b425c, #151822);
        border: 3px solid #3c4258;
        box-shadow: 0 0 12px rgba(0,0,0,0.8);
    }

    .emf-bottom-text {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #70789a;
    }
</style>

<script>
function setEMF(level) {
    // Désactive toutes les LEDs
    for (let i = 1; i <= 5; i++) {
        document.getElementById("led" + i).classList.remove("active");
    }

    // Active les LEDs jusqu'au niveau choisi
    for (let i = 1; i <= level; i++) {
        document.getElementById("led" + i).classList.add("active");
    }

    // Met à jour l'affichage du niveau EMF
    document.getElementById("emf-value").textContent = level;

    // Joue le son correspondant
    const sound = document.getElementById("sound" + level);
    sound.currentTime = 0;
    sound.play();
}
</script>
